      // 機構色彩池
      const ORG_COLORS = [
        'bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-rose-500',
        'bg-purple-500', 'bg-cyan-500', 'bg-indigo-500', 'bg-teal-500',
        'bg-orange-500', 'bg-fuchsia-500', 'bg-pink-500', 'bg-lime-500'
      ];
      const getOrgColor = (orgName) => {
        if (!orgName) return 'bg-slate-500';
        let hash = 0;
        for (let i = 0; i < orgName.length; i++) hash = orgName.charCodeAt(i) + ((hash << 5) - hash);
        return ORG_COLORS[Math.abs(hash) % ORG_COLORS.length];
      };

      // 解析 Google 試算表 JSONP 資料
      function fetchGoogleSheetData(sheetId, gid) {
        return new Promise((resolve, reject) => {
          const callbackName = 'sheetCallback_' + Math.floor(Math.random() * 10000000);
          const script = document.createElement('script');
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error('讀取 Google 試算表逾時 (15s)，請確認網路連線或權限'));
          }, 15000);

          function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[callbackName] = function(data) {
            cleanup();
            if (data && data.table && data.table.rows) {
              const rows = data.table.rows;
              // 欄位依序：檔案ID, 檔案名稱, 檔案分類, 子分類, 檔案年份, 檔案月份, 機構/區域, 上傳檔案, 上傳者, 上傳時間, 下載連結
              const parsed = rows.map((r, index) => {
                const c = r.c || [];
                const getVal = (idx) => {
                  if (!c[idx]) return '';
                  return c[idx].v !== null && c[idx].v !== undefined ? String(c[idx].v).trim() : '';
                };

                const fileId = getVal(0) || `record_${index + 1}`;
                const name = getVal(1) || '未命名檔案';
                const category = getVal(2) || '其他分類';
                const subCategory = getVal(3) || '';
                const rawRocYear = getVal(4) || '115';
                const rocYear = rawRocYear.includes('.') ? String(Math.floor(Number(rawRocYear))) : rawRocYear;
                const rawMonth = getVal(5) || '01';
                const month = rawMonth.padStart(2, '0');
                const org = getVal(6) || '未指定機構';
                const filePath = getVal(7) || '';
                const uploader = getVal(8) || '系統上傳';
                const uploadTime = getVal(9) || '';
                const downloadUrl = getVal(10) || '';

                // 推算西元年
                const adYear = Number(rocYear) ? String(Number(rocYear) + 1911) : '2026';
                const modifiedTime = `${adYear}-${month}-01`;

                // 從下載連結提取 Google Drive 檔案 ID
                let driveId = '';
                const idMatch = downloadUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (idMatch) {
                  driveId = idMatch[1];
                }

                // 產生預覽連結
                const viewUrl = driveId 
                  ? `https://drive.google.com/file/d/${driveId}/view` 
                  : (downloadUrl || 'https://drive.google.com');

                return {
                  id: fileId,
                  name,
                  category,
                  subCategory,
                  rocYear,
                  month,
                  adYear,
                  org,
                  filePath,
                  uploader,
                  uploadTime,
                  downloadUrl,
                  viewUrl,
                  driveId,
                  modifiedTime,
                  isCustom: false
                };
              });
              resolve(parsed);
            } else {
              reject(new Error('試算表格式不符合或資料為空'));
            }
          };

          script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}&gid=${gid}`;
          script.onerror = () => {
            cleanup();
            reject(new Error('無法載入 Google 試算表，請確認該試算表已開啟「知道連結的使用者皆可檢視」'));
          };
          document.body.appendChild(script);
        });
      }

      function App() {
        const [sheetId, setSheetId] = useState(() => localStorage.getItem('hok_sheet_id') || DEFAULT_SHEET_ID);
        const [sheetGid, setSheetGid] = useState(() => localStorage.getItem('hok_sheet_gid') || DEFAULT_SHEET_GID);
        const [webhookUrl, setWebhookUrl] = useState(() => localStorage.getItem('hok_apps_script_url') || '');

        const [records, setRecords] = useState([]);
        const [isLoading, setIsLoading] = useState(true);
        const [lastSyncTime, setLastSyncTime] = useState('');
        const [statusMessage, setStatusMessage] = useState('正在從 Google 試算表讀取資料...');
        
        // 收藏星號列表 (保存在 localStorage)
        const [starredIds, setStarredIds] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem('hok_starred_ids') || '[]');
          } catch(e) { return []; }
        });

        // 本機新增的自訂紀錄 (保存在 localStorage)
        const [customRecords, setCustomRecords] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem('hok_custom_records') || '[]');
          } catch(e) { return []; }
        });

        // 導覽狀態
        const [activeTab, setActiveTab] = useState('all'); // 'all', 'starred', 'org', 'category', 'date'
        const [selectedOrg, setSelectedOrg] = useState(null);
        const [selectedCategory, setSelectedCategory] = useState(null);
        const [selectedSubCategory, setSelectedSubCategory] = useState(null);
        const [selectedYearMonth, setSelectedYearMonth] = useState(null);
        const [searchQuery, setSearchQuery] = useState('');
        const [expandedYears, setExpandedYears] = useState(['115', '114']);

        // 分頁狀態
        const [currentPage, setCurrentPage] = useState(1);
        const pageSize = 24;

        // Modal 狀態
        const [isAddModalOpen, setIsAddModalOpen] = useState(false);
        const [isSettingsModalOpen, setIsSettingsModalOpen] = useState(false);
        const [copySuccess, setCopySuccess] = useState(false);

        // 新增紀錄表單狀態
        const [newRecordForm, setNewRecordForm] = useState({
          name: '',
          org: '護家',
          category: '消毒資料',
          subCategory: '消毒照片',
          rocYear: '115',
          month: '06',
          uploader: 'mis@hok2.com.tw',
          driveLinkOrId: '',
          customOrg: '',
          customCategory: ''
        });
        const [isSubmitting, setIsSubmitting] = useState(false);

        // 初始載入
        useEffect(() => {
          loadSheetRecords(sheetId, sheetGid);
        }, []);

        // 監聽收藏儲存
        useEffect(() => {
          localStorage.setItem('hok_starred_ids', JSON.stringify(starredIds));
        }, [starredIds]);

        // 監聽自訂紀錄儲存
        useEffect(() => {
          localStorage.setItem('hok_custom_records', JSON.stringify(customRecords));
        }, [customRecords]);

        // 載入 Google 試算表紀錄
        const loadSheetRecords = async (targetId, targetGid) => {
          setIsLoading(true);
          setStatusMessage('正在讀取 Google 試算表資料...');
          try {
            const data = await fetchGoogleSheetData(targetId, targetGid);
            setRecords(data);
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            setLastSyncTime(timeStr);
            setStatusMessage(`成功同步 ${data.length} 筆試算表紀錄 (最後同步: ${timeStr})`);
          } catch (err) {
            console.error('Fetch error:', err);
            setStatusMessage(`讀取失敗: ${err.message}`);
          } finally {
            setIsLoading(false);
          }
        };

        // 合併試算表資料與本機新增紀錄
        const allCombinedRecords = useMemo(() => {
          const combined = [...customRecords, ...records];
          return combined.map(item => ({
            ...item,
            starred: starredIds.includes(item.id)
          }));
        }, [records, customRecords, starredIds]);

        // 統計所有機構
        const orgStats = useMemo(() => {
          const map = new Map();
          allCombinedRecords.forEach(r => {
            const org = r.org || '其他';
            map.set(org, (map.get(org) || 0) + 1);
          });
          return Array.from(map.entries())
            .map(([name, count]) => ({ name, count }))
            .sort((a, b) => b.count - a.count);
        }, [allCombinedRecords]);

        // 統計所有分類
        const categoryStats = useMemo(() => {
          const map = new Map();
          allCombinedRecords.forEach(r => {
            const cat = r.category || '未分類';
            map.set(cat, (map.get(cat) || 0) + 1);
          });
          return Array.from(map.entries())
            .map(([name, count]) => ({ name, count }))
            .sort((a, b) => b.count - a.count);
        }, [allCombinedRecords]);

        // 統計年月份樹狀結構
        const yearMonthTree = useMemo(() => {
          const tree = {};
          allCombinedRecords.forEach(r => {
            const rocY = r.rocYear || '115';
            const m = r.month || '01';
            const ymKey = `${rocY}-${m}`;
            if (!tree[rocY]) tree[rocY] = new Set();
            tree[rocY].add(ymKey);
          });

          return Object.keys(tree)
            .sort((a, b) => Number(b) - Number(a))
            .map(rocYear => ({
              rocYear,
              adYear: String(Number(rocYear) + 1911),
              months: Array.from(tree[rocYear]).sort((a, b) => b.localeCompare(a))
            }));
        }, [allCombinedRecords]);

        // 篩選檔案清單
        const filteredRecords = useMemo(() => {
          return allCombinedRecords.filter(item => {
            // 關鍵字檢索
            if (searchQuery.trim() !== '') {
              const q = searchQuery.toLowerCase();
              const match = (item.name && item.name.toLowerCase().includes(q)) ||
                            (item.org && item.org.toLowerCase().includes(q)) ||
                            (item.category && item.category.toLowerCase().includes(q)) ||
                            (item.subCategory && item.subCategory.toLowerCase().includes(q)) ||
                            (item.uploader && item.uploader.toLowerCase().includes(q)) ||
                            (item.filePath && item.filePath.toLowerCase().includes(q));
              if (!match) return false;
            }

            // 分頁視圖條件
            if (activeTab === 'starred') return item.starred;
            if (activeTab === 'org' && selectedOrg) return item.org === selectedOrg;
            if (activeTab === 'category' && selectedCategory) {
              if (item.category !== selectedCategory) return false;
              if (selectedSubCategory && item.subCategory !== selectedSubCategory) return false;
              return true;
            }
            if (activeTab === 'date' && selectedYearMonth) {
              const [y, m] = selectedYearMonth.split('-');
              return item.rocYear === y && item.month === m;
            }

            return true;
          });
        }, [allCombinedRecords, searchQuery, activeTab, selectedOrg, selectedCategory, selectedSubCategory, selectedYearMonth]);

        // 每次篩選條件改變時重設頁碼至第一頁
        useEffect(() => {
          setCurrentPage(1);
        }, [searchQuery, activeTab, selectedOrg, selectedCategory, selectedSubCategory, selectedYearMonth]);

        // 分頁資料
        const totalPages = Math.ceil(filteredRecords.length / pageSize) || 1;
        const pagedRecords = useMemo(() => {
          const start = (currentPage - 1) * pageSize;
          return filteredRecords.slice(start, start + pageSize);
        }, [filteredRecords, currentPage]);

        // 切換星號收藏
        const toggleStar = (e, id) => {
          e.stopPropagation();
          setStarredIds(prev => 
            prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
          );
        };

        // 建立新紀錄處理
        const handleCreateRecord = async (e) => {
          e.preventDefault();
          if (!newRecordForm.name.trim()) {
            alert('請填寫檔案名稱！');
            return;
          }

          setIsSubmitting(true);
          const finalOrg = newRecordForm.org === '__custom__' ? newRecordForm.customOrg.trim() : newRecordForm.org;
          const finalCategory = newRecordForm.category === '__custom__' ? newRecordForm.customCategory.trim() : newRecordForm.category;
          const randomId = Math.random().toString(36).substring(2, 10);
          
          let driveId = '';
          let downloadUrl = newRecordForm.driveLinkOrId.trim();
          if (downloadUrl) {

}`;

                            <span className="px-2 py-0.5 rounded bg-blue-600/20 text-blue-300 border border-blue-500/30 text-[10px]">
                              {item.category}
                            </span>
                            {item.subCategory && (
                              <span className="px-2 py-0.5 rounded bg-slate-700/60 text-slate-300 text-[10px]">
                                {item.subCategory}
                              </span>
                            )}
                            {item.isCustom && (
                              <span className="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-[9px] border border-emerald-500/30">
                                新增紀錄
                              </span>
                            )}
                          </div>
                        </div>

                        {/* 底部元數據與操作按鈕 */}
                        <div className="pt-2.5 border-t border-slate-700/50 space-y-2 text-[10px]">
                          <div className="flex justify-between items-center text-slate-400">
                            <span className="flex items-center gap-1 font-mono">
                              <IconCalendar size={11} /> 115_{item.month} ({item.adYear})
                            </span>
                            <span className="text-slate-500 truncate max-w-[90px]" title={item.uploader}>
                              {item.uploader}
                            </span>
                          </div>

                          {/* 連結操作按鈕 */}
                          <div className="flex gap-2 pt-1">
                            <a
                              href={item.viewUrl}
                              target="_blank"
                              rel="noreferrer"
                              className="flex-1 flex items-center justify-center gap-1 bg-slate-700/60 hover:bg-slate-700 text-slate-200 py-1.5 rounded-lg transition"
                            >
                              <IconExternalLink size={12} />
                              <span>預覽文檔</span>
                            </a>
                            {item.downloadUrl && (
                              <a
                                href={item.downloadUrl}
                                target="_blank"
                                rel="noreferrer"
                                download
                                className="flex-1 flex items-center justify-center gap-1 bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 border border-blue-500/30 py-1.5 rounded-lg transition"
                              >
                                <IconDownload size={12} />
                                <span>下載</span>
                              </a>
                            )}
                          </div>
                        </div>

                      </div>
                    );
                  })}
                </div>

                {/* 分頁控制器 */}
                {totalPages > 1 && (
                  <div className="flex items-center justify-between border-t border-slate-800 pt-4 pb-2 text-xs">
                    <div className="text-slate-400">
                      顯示第 <span className="font-mono text-slate-200">{(currentPage - 1) * pageSize + 1}</span> 至{' '}
                      <span className="font-mono text-slate-200">{Math.min(currentPage * pageSize, filteredRecords.length)}</span> 筆 (共 {filteredRecords.length} 筆)
                    </div>

                    <div className="flex items-center gap-1.5">
                      <button
                        onClick={() => setCurrentPage(1)}
                        disabled={currentPage === 1}
                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 rounded-lg text-slate-300"
                      >
                        首頁
                      </button>
                      <button
                        onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                        disabled={currentPage === 1}
                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 rounded-lg text-slate-300"
                      >
                        上一頁
                      </button>
                      <span className="px-3 py-1 font-mono text-blue-400 bg-slate-800/80 rounded-lg border border-slate-700">
                        {currentPage} / {totalPages}
                      </span>
                      <button
                        onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                        disabled={currentPage === totalPages}
                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 rounded-lg text-slate-300"
                      >
                        下一頁
                      </button>
                      <button
                        onClick={() => setCurrentPage(totalPages)}
                        disabled={currentPage === totalPages}
                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 disabled:hover:bg-slate-800 rounded-lg text-slate-300"
                      >
                        末頁
                      </button>
                    </div>
                  </div>
                )}

              </div>

            </main>

            {/* Modal: 建立新檔案紀錄 */}
            {isAddModalOpen && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg p-6 space-y-4 text-xs">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 className="font-bold text-sm text-slate-100 flex items-center gap-2">
                      <IconPlus size={18} className="text-blue-400" />
                      <span>建立新檔案紀錄</span>
                    </h3>
                    <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-slate-200">
                      <IconX size={16} />
                    </button>
                  </div>

                  <form onSubmit={handleCreateRecord} className="space-y-3.5">
                    <div>
                      <label className="block text-slate-300 mb-1 font-semibold">檔案名稱 <span className="text-red-400">*</span></label>
                      <input 
                        type="text" 
                        required
                        placeholder="例如: 115_06_護家_消毒資料_消毒照片"
                        value={newRecordForm.name}
                        onChange={(e) => setNewRecordForm({ ...newRecordForm, name: e.target.value })}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-slate-300 mb-1 font-semibold">機構 / 區域</label>
                        <select
                          value={newRecordForm.org}
                          onChange={(e) => setNewRecordForm({ ...newRecordForm, org: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500"
                        >
                          {orgStats.map(o => (
                            <option key={o.name} value={o.name}>{o.name}</option>
                          ))}
                          <option value="__custom__">+ 自訂新機構...</option>
                        </select>
                        {newRecordForm.org === '__custom__' && (
                          <input 
                            type="text" 
                            placeholder="輸入新機構名稱"
                            value={newRecordForm.customOrg}
                            onChange={(e) => setNewRecordForm({ ...newRecordForm, customOrg: e.target.value })}
                            className="mt-1.5 w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500"
                          />
                        )}
                      </div>

                      <div>
                        <label className="block text-slate-300 mb-1 font-semibold">檔案分類</label>
                        <select
                          value={newRecordForm.category}
                          onChange={(e) => setNewRecordForm({ ...newRecordForm, category: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500"
                        >
                          {categoryStats.map(c => (
                            <option key={c.name} value={c.name}>{c.name}</option>
                          ))}
                          <option value="__custom__">+ 自訂新分類...</option>
                        </select>
                        {newRecordForm.category === '__custom__' && (
                          <input 
                            type="text" 
                            placeholder="輸入新分類名稱"
                            value={newRecordForm.customCategory}
                            onChange={(e) => setNewRecordForm({ ...newRecordForm, customCategory: e.target.value })}
                            className="mt-1.5 w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500"
                          />
                        )}
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <label className="block text-slate-300 mb-1 font-semibold">子分類</label>
                        <input 
                          type="text" 
                          placeholder="例如: 消毒照片"
                          value={newRecordForm.subCategory}
                          onChange={(e) => setNewRecordForm({ ...newRecordForm, subCategory: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-300 mb-1 font-semibold">民國年份</label>
                        <input 
                          type="text" 
                          placeholder="115"
                          value={newRecordForm.rocYear}
                          onChange={(e) => setNewRecordForm({ ...newRecordForm, rocYear: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-300 mb-1 font-semibold">月份</label>
                        <input 
                          type="text" 
                          placeholder="06"
                          value={newRecordForm.month}
                          onChange={(e) => setNewRecordForm({ ...newRecordForm, month: e.target.value })}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 font-mono"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-300 mb-1 font-semibold">Google Drive 下載連結或檔案 ID</label>
                      <input 
                        type="text" 
                        placeholder="例如: https://drive.google.com/file/d/1NGincEB... 或檔案 ID"
                        value={newRecordForm.driveLinkOrId}
                        onChange={(e) => setNewRecordForm({ ...newRecordForm, driveLinkOrId: e.target.value })}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-300 mb-1 font-semibold">上傳者</label>
                      <input 
                        type="text" 
                        value={newRecordForm.uploader}
                        onChange={(e) => setNewRecordForm({ ...newRecordForm, uploader: e.target.value })}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div className="flex justify-between items-center pt-3 border-t border-slate-800">
                      <button
                        type="button"
                        onClick={() => setIsAddModalOpen(false)}
                        className="text-slate-400 hover:text-slate-200"
                      >
                        取消
                      </button>
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium transition flex items-center gap-2"
                      >
                        {isSubmitting ? '儲存中...' : '確認建立紀錄'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal: 設定與 Apps Script 回寫設定 */}
            {isSettingsModalOpen && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xl p-6 space-y-4 text-xs max-h-[90vh] overflow-y-auto custom-scrollbar">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 className="font-bold text-sm text-slate-100 flex items-center gap-2">
                      <IconSettings size={18} />
                      <span>資料來源與 Google Apps Script 回寫設定</span>
                    </h3>
                    <button onClick={() => setIsSettingsModalOpen(false)} className="text-slate-400 hover:text-slate-200">
                      <IconX size={16} />
                    </button>
                  </div>

                  <div className="space-y-4">
                    <div>
                      <label className="block text-slate-300 mb-1 font-semibold">Google 試算表 ID</label>
                      <input 
                        type="text" 
                        value={sheetId}
                        onChange={(e) => {
                          setSheetId(e.target.value);
                          localStorage.setItem('hok_sheet_id', e.target.value);
                        }}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 font-mono text-xs"
                      />
                      <p className="text-[11px] text-slate-500 mt-1">
                        預設: <code>1X5-VXaa-eKAzpvGJZgzODh_hc4uvdVwkcjTFj-UWFG8</code>
                      </p>
                    </div>

                    <div>
                      <label className="block text-slate-300 mb-1 font-semibold">試算表工作表 GID</label>
                      <input 
                        type="text" 
                        value={sheetGid}
                        onChange={(e) => {
                          setSheetGid(e.target.value);
                          localStorage.setItem('hok_sheet_gid', e.target.value);
                        }}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 font-mono text-xs"
                      />
                    </div>

                    <div className="pt-2 border-t border-slate-800">
                      <label className="block text-slate-300 mb-1 font-semibold">
                        Google Apps Script Web App 網址 (用於同步回寫試算表)
                      </label>
                      <input 
                        type="text" 
                        placeholder="例如: https://script.google.com/macros/s/AKfycbx.../exec"
                        value={webhookUrl}
                        onChange={(e) => {
                          setWebhookUrl(e.target.value);
                          localStorage.setItem('hok_apps_script_url', e.target.value);
                        }}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500 font-mono text-xs"
                      />
                      <p className="text-[11px] text-slate-500 mt-1">
                        若填寫此 Webhook 網址，在網頁建立新紀錄時會自動同步追加一行至試算表！
                      </p>
                    </div>

                    {/* Apps Script 快速指引 */}
                    <div className="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="font-semibold text-slate-300 text-xs">Google Apps Script 試算表寫入代碼</span>
                        <button
                          type="button"
                          onClick={copyAppsScript}
                          className="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-[11px] transition"
                        >
                          {copySuccess ? '已複製代碼！' : '一鍵複製腳本'}
                        </button>
                      </div>
                      <ol className="list-decimal pl-4 space-y-1 text-slate-400 text-[11px] leading-relaxed">
                        <li>在 Google 試算表選單點擊 <b>擴充功能 ➔ Apps Script</b>。</li>
                        <li>清除原有程式碼，點擊上方按鈕複製代碼並貼上。</li>
                        <li>點擊右上角 <b>部署 ➔ 新增部署作業</b>。</li>
                        <li>類型選擇「網頁應用程式」，將「誰可以存取」設為<b>「所有人」</b>。</li>
                        <li>複製產生的網頁應用程式網址，貼至上方欄位即可！</li>
                      </ol>
                    </div>
                  </div>

                  <div className="flex justify-between items-center pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => {
                        localStorage.removeItem('hok_custom_records');
                        setCustomRecords([]);
                        alert('已清除本機自訂紀錄');
                      }}
                      className="text-red-400 hover:text-red-300"
                    >
                      清除本機新增紀錄
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        loadSheetRecords(sheetId, sheetGid);
                        setIsSettingsModalOpen(false);
                      }}
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium"
                    >
                      套用並重新載入
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
