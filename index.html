      // URL 安全驗證與消毒函式 (嚴格鎖定 Google Drive / Google Docs 官方安全網域，防範 XSS 與惡意跳轉)
      function sanitizeSafeUrl(rawUrl, fallback = '') {
        if (!rawUrl || typeof rawUrl !== 'string') return fallback;
        const trimmed = rawUrl.trim();
        // 嚴格僅放行 https://drive.google.com/ 或 https://docs.google.com/ 開頭的合法網址
        if (/^https:\/\/(drive|docs)\.google\.com(\/[a-zA-Z0-9_\-\.\/\?\=\&\%]*)?$/i.test(trimmed)) {
          return trimmed;
        }
        return fallback;
      }

      // 解析 Google 試算表 JSONP 資料
      function fetchGoogleSheetData(sheetId, gid) {
        return new Promise((resolve, reject) => {
          // 校驗 sheetId 與 gid 格式
          const safeSheetId = /^[a-zA-Z0-9_-]+$/.test(sheetId) ? sheetId : DEFAULT_SHEET_ID;
          const safeGid = /^\d+$/.test(gid) ? gid : DEFAULT_SHEET_GID;

          const callbackName = 'sheetCallback_' + Math.floor(Math.random() * 10000000);
          const script = document.createElement('script');
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error('讀取 Google 試算表逾時 (15s)，請確認網路連線或權限'));
          }, 15000);

          function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[callbackName] = function(data) {
            cleanup();
            if (data && data.table && data.table.rows) {
              const rows = data.table.rows;
              // 欄位依序：0:檔案ID, 1:檔案名稱, 2:檔案分類, 3:子分類, 4:檔案年份, 5:檔案月份, 6:機構/區域, 7:下載連結
              const parsed = rows.map((r, index) => {
                const c = r.c || [];
                const getVal = (idx) => {
                  if (!c[idx]) return '';
                  return c[idx].v !== null && c[idx].v !== undefined ? String(c[idx].v).trim() : '';
                };

                const fileId = getVal(0) || `record_${index + 1}`;
                const name = getVal(1) || '未命名檔案';
                const category = getVal(2) || '其他分類';
                const subCategory = getVal(3) || '';
                const rawRocYear = getVal(4) || '115';
                const rocYear = rawRocYear.includes('.') ? String(Math.floor(Number(rawRocYear))) : rawRocYear;
                const rawMonth = getVal(5) || '01';
                const month = rawMonth.padStart(2, '0');
                const org = getVal(6) || '未指定機構';
                const rawDownloadUrl = getVal(7) || getVal(10) || '';

                // 推算西元年
                const adYear = Number(rocYear) ? String(Number(rocYear) + 1911) : '2026';
                const modifiedTime = `${adYear}-${month}-01`;

                // 從下載連結提取 Google Drive 檔案 ID (加入安全性格式檢驗)
                let driveId = '';
                const idMatch = rawDownloadUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (idMatch && /^[a-zA-Z0-9_-]{10,60}$/.test(idMatch[1])) {
                  driveId = idMatch[1];
                }

                // 產生經過安全性過濾的預覽與下載連結
                const downloadUrl = sanitizeSafeUrl(rawDownloadUrl, '');
                const viewUrl = driveId 
                  ? `https://drive.google.com/file/d/${driveId}/view` 
                  : (downloadUrl || 'https://drive.google.com');

                return {
                  id: fileId,
                  name,
                  category,
                  subCategory,
                  rocYear,
                  month,
                  adYear,
                  org,
                  orgGroup: getOrgGroup(org),
                  downloadUrl,
                  viewUrl,
                  driveId,
                  modifiedTime
                };
              });
              resolve(parsed);
            } else {
              reject(new Error('試算表格式不符合或資料為空'));
            }
          };

          script.src = `https://docs.google.com/spreadsheets/d/${safeSheetId}/gviz/tq?tqx=responseHandler:${callbackName}&gid=${safeGid}`;
          script.onerror = () => {
            cleanup();
            reject(new Error('無法載入 Google 試算表，請確認該試算表已開啟「知道連結的使用者皆可檢視」'));
          };
          document.body.appendChild(script);
        });
      }

      function App() {
        const [records, setRecords] = useState([]);
        const [isLoading, setIsLoading] = useState(true);
        const [lastSyncTime, setLastSyncTime] = useState('');
        const [statusMessage, setStatusMessage] = useState('正在從 Google 試算表讀取資料...');

        // 多選標籤篩選狀態 (支援 年份 + 機構 + 檔案類別 + 子分類 跨維度複合多選)
        const [selectedYears, setSelectedYears] = useState([]);         // 例如: ['115']
        const [selectedMonths, setSelectedMonths] = useState([]);       // 例如: ['115-06']
        const [selectedOrgs, setSelectedOrgs] = useState([]);           // 例如: ['護家']
        const [selectedCategories, setSelectedCategories] = useState([]);// 例如: ['消毒資料']
        const [selectedSubCategories, setSelectedSubCategories] = useState([]);// 例如: ['消毒資料::消毒照片']
        const [searchQuery, setSearchQuery] = useState('');
        const [expandedYears, setExpandedYears] = useState([]);         // 橫向年份展開狀態 (儲存展開月份的年份，例如: ['115'])
        const [expandedGroups, setExpandedGroups] = useState({ benGuan: true, xinGuan: true });
        const [expandedCategories, setExpandedCategories] = useState(['消毒資料', '合約']);

        // 檔案勾選與批量下載狀態
        const [selectedFileIds, setSelectedFileIds] = useState([]);
        const [batchDownloadProgress, setBatchDownloadProgress] = useState(null); // { current, total, isRunning }

        // 顯示方式切換狀態: 'grid' (方框式，預設) 或 'list' (清單式)
        const [viewMode, setViewMode] = useState(() => localStorage.getItem('hok_view_mode') || 'grid');

        // 分頁狀態 (方框式每頁 24 筆，清單式每頁 30 筆)
        const [currentPage, setCurrentPage] = useState(1);
        const pageSize = viewMode === 'grid' ? 24 : 30;

        // 儲存顯示方式偏好設定
        useEffect(() => {
          localStorage.setItem('hok_view_mode', viewMode);
        }, [viewMode]);

        // Modal 狀態 (僅保留版本更新紀錄彈窗)
        const [isChangelogModalOpen, setIsChangelogModalOpen] = useState(false);

        // 初始載入
        useEffect(() => {
          loadSheetRecords();
        }, []);

        // 載入 Google 試算表紀錄 (鎖定官方預設試算表常數)
        const loadSheetRecords = async () => {
          setIsLoading(true);
          setStatusMessage('正在讀取 Google 試算表資料...');
          try {
            const data = await fetchGoogleSheetData(DEFAULT_SHEET_ID, DEFAULT_SHEET_GID);
            setRecords(data);
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            setLastSyncTime(timeStr);
            setStatusMessage(`成功同步 ${data.length} 筆試算表紀錄 (最後同步: ${timeStr})`);
          } catch (err) {
            console.error('Fetch error:', err);
            setStatusMessage(`讀取失敗: ${err.message}`);
          } finally {
            setIsLoading(false);
          }
        };

        // 試算表資料清單
        const allCombinedRecords = useMemo(() => {
          return records.map(item => ({
            ...item,
            orgGroup: getOrgGroup(item.org)
          }));
        }, [records]);

        // 機構按「本館」與「新館」分組統計
        const orgGroupsData = useMemo(() => {
          const map = new Map();
          allCombinedRecords.forEach(r => {
            const org = r.org || '其他';
            map.set(org, (map.get(org) || 0) + 1);
          });

          const benGuan = [];
          const xinGuan = [];

          map.forEach((count, name) => {
            const grp = getOrgGroup(name);
            if (grp === '新館') {
              xinGuan.push({ name, count, group: '新館' });
            } else {
              benGuan.push({ name, count, group: '本館' });
            }
          });

          benGuan.sort((a, b) => b.count - a.count);
          xinGuan.sort((a, b) => b.count - a.count);

          const benGuanTotal = benGuan.reduce((acc, cur) => acc + cur.count, 0);
          const xinGuanTotal = xinGuan.reduce((acc, cur) => acc + cur.count, 0);

          return {
            benGuan,
            xinGuan,
            benGuanTotal,
            xinGuanTotal
          };
        }, [allCombinedRecords]);

        // 統計檔案類別與子分類階層結構 (根據試算表 D 欄子分類細分)
        const categoryHierarchy = useMemo(() => {
          const catMap = new Map();

          allCombinedRecords.forEach(r => {
            const cat = r.category || '未分類';
            const sub = (r.subCategory || '').trim();

            if (!catMap.has(cat)) {
              catMap.set(cat, {
                name: cat,
                count: 0,
                subMap: new Map()
              });
            }

            const item = catMap.get(cat);
            item.count += 1;

            if (sub) {
              item.subMap.set(sub, (item.subMap.get(sub) || 0) + 1);
            }
          });

          return Array.from(catMap.values())
            .map(item => {
              const subList = Array.from(item.subMap.entries())
                .map(([subName, subCount]) => ({ name: subName, count: subCount }))
                .sort((a, b) => b.count - a.count);

              return {
                name: item.name,
                count: item.count,
                hasSub: subList.length > 0,
                subList
              };
            })
            .sort((a, b) => b.count - a.count);
        }, [allCombinedRecords]);

        // 保留相容的 categoryStats 供舊元件與 Modal 使用
        const categoryStats = useMemo(() => {
          return categoryHierarchy.map(c => ({ name: c.name, count: c.count }));
        }, [categoryHierarchy]);

        // 統計年月份樹狀結構
        const yearMonthTree = useMemo(() => {
          const tree = {};
          allCombinedRecords.forEach(r => {
            const rocY = r.rocYear || '115';
            const m = r.month || '01';
            const ymKey = `${rocY}-${m}`;
            if (!tree[rocY]) tree[rocY] = new Set();
            tree[rocY].add(ymKey);
          });

          return Object.keys(tree)
            .sort((a, b) => Number(b) - Number(a))
            .map(rocYear => ({
              rocYear,
              adYear: String(Number(rocYear) + 1911),
              months: Array.from(tree[rocYear]).sort((a, b) => b.localeCompare(a))
            }));
        }, [allCombinedRecords]);

        // 標籤多選切換函式
        const toggleYear = (year) => {
          setSelectedYears(prev => 
            prev.includes(year) ? prev.filter(y => y !== year) : [...prev, year]
          );
        };

        const toggleMonth = (ym) => {
          setSelectedMonths(prev => 
            prev.includes(ym) ? prev.filter(item => item !== ym) : [...prev, ym]
          );
        };

        const toggleOrg = (org) => {
          setSelectedOrgs(prev => 
            prev.includes(org) ? prev.filter(o => o !== org) : [...prev, org]
          );
        };

        // 一鍵全選 / 取消全選本館或新館內的所有機構
        const selectAllInGroup = (groupType) => {
          const targetList = groupType === '本館' ? orgGroupsData.benGuan : orgGroupsData.xinGuan;
          const targetOrgNames = targetList.map(o => o.name);
          const isAllSelected = targetOrgNames.every(name => selectedOrgs.includes(name));

          if (isAllSelected) {
            // 取消選取該館所有機構
            setSelectedOrgs(prev => prev.filter(name => !targetOrgNames.includes(name)));
          } else {
            // 全選該館所有機構
            setSelectedOrgs(prev => Array.from(new Set([...prev, ...targetOrgNames])));
          }
        };

        const toggleCategory = (cat) => {
          setSelectedCategories(prev => 
            prev.includes(cat) ? prev.filter(c => c !== cat) : [...prev, cat]
          );
        };

        const toggleSubCategory = (cat, sub) => {
          const key = `${cat}::${sub}`;
          setSelectedSubCategories(prev => 
            prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]
          );
        };

        const toggleCategoryExpand = (cat) => {
          setExpandedCategories(prev => 
            prev.includes(cat) ? prev.filter(c => c !== cat) : [...prev, cat]
          );
        };

        // 清除所有標籤篩選
        const clearAllFilters = () => {
          setSelectedYears([]);
          setSelectedMonths([]);
          setSelectedOrgs([]);
          setSelectedCategories([]);
          setSelectedSubCategories([]);
          setSearchQuery('');
        };

        // 是否有任何篩選條件生效
        const hasActiveFilters = useMemo(() => {
          return selectedYears.length > 0 || 
                 selectedMonths.length > 0 || 
                 selectedOrgs.length > 0 || 
                 selectedCategories.length > 0 || 
                 selectedSubCategories.length > 0 || 
                 searchQuery.trim() !== '';
        }, [selectedYears, selectedMonths, selectedOrgs, selectedCategories, selectedSubCategories, searchQuery]);

        // 篩選檔案清單 (年份 + 機構 + 檔案類別/子分類 跨維度複合多選過濾)
        const filteredRecords = useMemo(() => {
          return allCombinedRecords.filter(item => {
            // 1. 關鍵字檢索 (比對名稱、機構、分類、子分類)
            if (searchQuery.trim() !== '') {
              const q = searchQuery.toLowerCase();
              const match = (item.name && item.name.toLowerCase().includes(q)) ||
                            (item.org && item.org.toLowerCase().includes(q)) ||
                            (item.category && item.category.toLowerCase().includes(q)) ||
                            (item.subCategory && item.subCategory.toLowerCase().includes(q));
              if (!match) return false;
            }

            // 2. 年份多選篩選 (若選了年份，項目年份必須在選取清單中)
            if (selectedYears.length > 0 && !selectedYears.includes(item.rocYear)) {
              return false;
            }

            // 3. 特定年月篩選 (若選取了特定年月，必須吻合)
            if (selectedMonths.length > 0) {
              const ym = `${item.rocYear}-${item.month}`;
              if (!selectedMonths.includes(ym)) return false;
            }

            // 4. 機構/區域多選篩選 (若選了機構，項目機構必須在選取清單中)
            if (selectedOrgs.length > 0 && !selectedOrgs.includes(item.org)) {
              return false;
            }

            // 5. 檔案類別與子分類複合篩選：
            // 如果選取了父類別或子分類，項目只要符合所選的父類別 或 所選的子分類即符合
            if (selectedCategories.length > 0 || selectedSubCategories.length > 0) {
              const matchParent = selectedCategories.includes(item.category);
              const subKey = `${item.category}::${(item.subCategory || '').trim()}`;
              const matchSub = selectedSubCategories.includes(subKey);

              if (!matchParent && !matchSub) {
                return false;
              }
            }

            return true;
          });
        }, [allCombinedRecords, searchQuery, selectedYears, selectedMonths, selectedOrgs, selectedCategories, selectedSubCategories]);

        // 每次篩選條件改變時重設頁碼至第一頁
        useEffect(() => {
          setCurrentPage(1);
        }, [searchQuery, selectedYears, selectedMonths, selectedOrgs, selectedCategories, selectedSubCategories]);

        // 分頁資料
        const totalPages = Math.ceil(filteredRecords.length / pageSize) || 1;
        const pagedRecords = useMemo(() => {
          const start = (currentPage - 1) * pageSize;
          return filteredRecords.slice(start, start + pageSize);
        }, [filteredRecords, currentPage]);

        // 檔案勾選切換
        const toggleFileSelection = (id) => {
          setSelectedFileIds(prev => 
            prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
          );
        };

        // 全選 / 取消全選目前頁面的檔案
        const isCurrentPageAllSelected = useMemo(() => {
          if (pagedRecords.length === 0) return false;
          return pagedRecords.every(r => selectedFileIds.includes(r.id));
        }, [pagedRecords, selectedFileIds]);

        const toggleSelectCurrentPage = () => {
          const currentPageIds = pagedRecords.map(r => r.id);
          if (isCurrentPageAllSelected) {
            setSelectedFileIds(prev => prev.filter(id => !currentPageIds.includes(id)));
          } else {
            setSelectedFileIds(prev => Array.from(new Set([...prev, ...currentPageIds])));
          }
        };

        // 全選所有符合篩選條件的檔案
        const selectAllFilteredFiles = () => {
          const allFilteredIds = filteredRecords.map(r => r.id);
          setSelectedFileIds(allFilteredIds);
        };

        // 清空所有選取的檔案
        const clearFileSelection = () => {
          setSelectedFileIds([]);
        };

        // 方案A：排程依序批量觸發下載
        const startBatchDownload = () => {
          const filesToDownload = allCombinedRecords.filter(r => selectedFileIds.includes(r.id) && r.downloadUrl);
          if (filesToDownload.length === 0) {
            alert('選取的檔案中沒有可下載的連結！');
            return;
          }

          if (batchDownloadProgress && batchDownloadProgress.isRunning) {
            return;
          }

          setBatchDownloadProgress({
            current: 0,
            total: filesToDownload.length,
            isRunning: true
          });

          filesToDownload.forEach((file, index) => {
            setTimeout(() => {
              // 建立隱藏 iframe 進行下載，避免彈窗阻擋與跳轉
              const iframe = document.createElement('iframe');
              iframe.style.display = 'none';
              iframe.src = file.downloadUrl;
              document.body.appendChild(iframe);
              setTimeout(() => {
                if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
              }, 60000);

              setBatchDownloadProgress(prev => {
                if (!prev) return null;
                const nextCurrent = index + 1;
                const isFinished = nextCurrent >= filesToDownload.length;
                if (isFinished) {
                  setTimeout(() => setBatchDownloadProgress(null), 3000);
                }
                return {
                  ...prev,
                  current: nextCurrent,
                  isRunning: !isFinished
                };
              });
            }, index * 800); // 間隔 800ms，確保平穩不被瀏覽器封鎖
          });
        };

        // 檢查本館或新館是否全選
        const isBenGuanAllSelected = orgGroupsData.benGuan.length > 0 && orgGroupsData.benGuan.every(o => selectedOrgs.includes(o.name));
        const isXinGuanAllSelected = orgGroupsData.xinGuan.length > 0 && orgGroupsData.xinGuan.every(o => selectedOrgs.includes(o.name));

        return (
          <div className="flex h-screen w-screen bg-slate-900 text-slate-100 font-sans overflow-hidden">
            
            {/* 側邊導航列 (固定 320px 寬度，高雅層級) */}
            <aside className="w-80 min-w-[320px] max-w-[320px] bg-slate-950 border-r border-slate-800 flex flex-col flex-shrink-0 h-full overflow-hidden select-none">
              
              {/* Header */}
              <div className="p-4 border-b border-slate-800 flex items-center justify-between flex-shrink-0">
                <div className="flex items-center gap-3.5">
                  <div className="w-12 h-12 p-1.5 bg-slate-900/90 border border-slate-800 rounded-2xl shadow-md flex items-center justify-center flex-shrink-0 overflow-hidden ring-1 ring-slate-800">
                    <img 
                      src="logo.png" 
                      alt="清福檔案庫 Logo" 
                      className="w-full h-full object-contain drop-shadow"
                    />
                  </div>
                  <div>
                    <h1 className="font-bold text-base text-slate-100 flex items-center gap-1.5 leading-snug">
                      <span>清福檔案庫</span>
                      <button
                        onClick={() => setIsChangelogModalOpen(true)}
                        title="點擊查看系統更新版本紀錄"
                        className="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 hover:text-blue-300 transition font-mono border border-blue-500/30 cursor-pointer"
                      >
                        v3.4
                      </button>
                    </h1>
                    <div className="flex items-center gap-1.5 text-[11px] text-slate-400 mt-1">
                      <span className={`w-2 h-2 rounded-full ${isLoading ? 'bg-amber-400 animate-ping' : 'bg-emerald-400'}`} />
                      <span>{isLoading ? '同步中...' : `試算表已連線 (${allCombinedRecords.length} 筆)`}</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* 快捷操作按鈕群 */}
              <div className="p-3 border-b border-slate-800/60 flex-shrink-0">
                <button
                  onClick={() => loadSheetRecords()}
                  disabled={isLoading}
                  className="w-full flex items-center justify-center gap-1.5 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 py-2 px-3 rounded-xl text-xs text-slate-200 hover:text-white transition font-medium shadow-sm"
                >
                  <IconRefresh size={14} className={isLoading ? 'animate-spin' : ''} />
                  <span>{isLoading ? '同步中...' : '重新抓取試算表'}</span>
                </button>
              </div>

              {/* 導覽與多選標籤樹狀選單 */}
              <div className="flex-1 overflow-y-auto p-3 space-y-4 custom-scrollbar text-xs">
                
                {/* 檔案總覽選單 */}
                <div className="space-y-1.5">
                  <div className="px-1 font-bold text-slate-400 uppercase tracking-wider text-xs flex items-center justify-between">
                    <span className="flex items-center gap-1.5">
                      <IconFolder size={14} className="text-blue-400" />
                      <span>文檔總覽</span>
                    </span>
                    {hasActiveFilters && (
                      <button 
                        onClick={clearAllFilters}
                        className="text-xs text-red-400 hover:text-red-300 hover:underline font-medium"
                      >
                        重設篩選
                      </button>
                    )}
                  </div>
                  
                  {/* 全部檔案 (點擊恢復全覽) */}
                  <button
                    onClick={clearAllFilters}
                    className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium transition ${
                      !hasActiveFilters 
                        ? 'bg-blue-600/20 text-blue-300 border border-blue-500/40 shadow-sm' 
                        : 'bg-slate-900/60 border border-slate-800 text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      <IconFolder size={16} className={!hasActiveFilters ? 'text-blue-400' : 'text-slate-400'} />
                      <span className="text-sm font-semibold">全部檔案紀錄</span>
                    </div>
                    <span className="bg-slate-800/90 border border-slate-700/60 px-2 py-0.5 rounded-full text-xs text-slate-300 font-mono font-semibold">
                      {allCombinedRecords.length}
                    </span>
                  </button>
                </div>

                {/* 維度 1：【機構 / 區域分類】獨立分組大卡片 */}
                <div className="bg-slate-900/60 rounded-2xl p-3 border border-slate-800 shadow-sm space-y-3">
                  
                  {/* 分組標題列 */}
                  <div className="flex items-center justify-between pb-2 border-b border-slate-800/90">
                    <div className="flex items-center gap-2">
                      <span className="p-1 rounded-lg bg-blue-500/15 text-blue-400 border border-blue-500/30">
                        <IconBuilding size={15} />
                      </span>
                      <span className="text-[13px] font-bold text-slate-100 tracking-wide">
                        機構 / 區域分類
                      </span>
                    </div>
                    {selectedOrgs.length > 0 && (
                      <button 
                        onClick={() => setSelectedOrgs([])}
                        className="text-xs text-blue-400 hover:text-blue-300 hover:underline font-medium"
                      >
                        清除 ({selectedOrgs.length})
                      </button>
                    )}
                  </div>

                  {/* 本館與新館子分組列表 */}
                  <div className="space-y-2.5">
                    
                    {/* 1.1 本館分組卡片 */}
                    <div className="bg-slate-950/70 rounded-xl p-2.5 border border-slate-800/80 space-y-1.5">
                      <div className="flex items-center justify-between px-1 py-0.5">
                        <button
                          onClick={() => setExpandedGroups(prev => ({ ...prev, benGuan: !prev.benGuan }))}
                          className="flex items-center gap-1.5 text-sm font-bold text-slate-100 hover:text-blue-300 transition"
                        >
                          <span className="text-base">🏛️</span>
                          <span>本館</span>
                          <span className="text-xs text-slate-400 font-mono font-normal">
                            ({orgGroupsData.benGuanTotal} 筆 / {orgGroupsData.benGuan.length} 區)
                          </span>
                        </button>

                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => selectAllInGroup('本館')}
                            title={isBenGuanAllSelected ? '取消全選本館' : '全選本館所有分區'}
                            className={`text-xs px-2 py-0.5 rounded-md font-medium transition ${
                              isBenGuanAllSelected 
                                ? 'bg-blue-600 text-white shadow-sm' 
                                : 'text-blue-400 hover:bg-slate-800 border border-blue-500/30'
                            }`}
                          >
                            {isBenGuanAllSelected ? '取消全選' : '全選'}
                          </button>
                          <button
                            onClick={() => setExpandedGroups(prev => ({ ...prev, benGuan: !prev.benGuan }))}
                            className="text-slate-400 hover:text-slate-200 p-1 rounded hover:bg-slate-800 transition"
                            title={expandedGroups.benGuan ? '收合分區' : '展開分區'}
                          >
                            {expandedGroups.benGuan ? <IconChevronDown size={14} /> : <IconChevronRight size={14} />}
                          </button>
                        </div>
                      </div>

                      {expandedGroups.benGuan && (
                        <div className="space-y-1 max-h-52 overflow-y-auto custom-scrollbar pr-1 pt-1.5 border-t border-slate-800/70">
                          {orgGroupsData.benGuan.map(({ name, count }) => {
                            const isSelected = selectedOrgs.includes(name);
                            const colorObj = getOrgColor(name);

                            return (
                              <button
                                key={name}
                                onClick={() => toggleOrg(name)}
                                className={`w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-[13px] font-medium transition ${
                                  isSelected 
                                    ? 'bg-blue-600/30 text-blue-200 border border-blue-500/50 shadow-sm' 
                                    : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'
                                }`}
                              >
                                <div className="flex items-center gap-2 truncate">
                                  <span 
                                    className="w-2.5 h-2.5 rounded-full flex-shrink-0 ring-1 ring-white/20 shadow-sm"
                                    style={{ backgroundColor: colorObj.bg }}
                                  />
                                  <span className="truncate">{name}</span>
                                  {isSelected && <IconCheck size={13} className="text-blue-400 flex-shrink-0" />}
                                </div>
                                <span className={`text-[11px] font-mono px-2 py-0.5 rounded-md flex-shrink-0 ${
                                  isSelected ? 'bg-blue-500/40 text-blue-200 font-semibold' : 'bg-slate-850 text-slate-400'
                                }`}>
                                  {count}
                                </span>
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    {/* 1.2 新館分組卡片 */}

                                        <IconDownload size={12} />
                                        <span>下載</span>
                                      </a>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
