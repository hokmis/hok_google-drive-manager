      // 模擬 Google Drive 抓回的檔案清單 (含有 Google 格式、修改時間、資料夾 parent 與預覽連結)

        },

          name: '2026_公司規章制度與員工手冊_v3.pdf',

        },

          name: '2026_品牌 Logo 視覺設計稿_高解析度.png',
          mimeType: 'image/png',
          modifiedTime: '2026-06-02T11:00:00.000Z',

          folderName: '設計視覺專案',
          folderId: 'folder_design',
          starred: true,
          webViewLink: 'https://drive.google.com',
          iconType: 'image',
          author: 'Elena Chang',
          description: '向量匯出圖檔，包含深色與淺色背景的標準企業標誌。'
        },
        {
          id: 'gdrive_sheet_2',
          name: '2025_Q4_稅務結算清單.xlsx',
          mimeType: 'application/vnd.google-apps.spreadsheet',
          modifiedTime: '2025-12-28T10:15:00.000Z',
          size: '2300000',
          folderName: '財務審核部門',
          folderId: 'folder_finance',
          starred: false,
          webViewLink: 'https://sheets.google.com',
          iconType: 'sheet',

          description: '2025 年度第四季各部門銷項與進項發票彙整。'
        }

      function App() {
        const [driveFiles, setDriveFiles] = useState(MOCK_DRIVE_FILES);
        const [isConnected, setIsConnected] = useState(false);
        const [authMode, setAuthMode] = useState('demo'); // 'demo' | 'live'
        const [userProfile, setUserProfile] = useState({ name: 'Google Drive 體驗用戶', email: 'user@gmail.com' });
        
        // 導覽狀態
        const [activeTab, setActiveTab] = useState('all'); // 'all', 'starred', 'trash', 'folder', 'date'
        const [selectedFolderId, setSelectedFolderId] = useState(null);
        const [selectedYearMonth, setSelectedYearMonth] = useState(null);
        const [searchQuery, setSearchQuery] = useState('');
        const [expandedYears, setExpandedYears] = useState(['2026', '2025']);

        // Google Cloud API 設定彈窗
        const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
        const [clientId, setClientId] = useState('');
        const [apiKey, setApiKey] = useState('');
        const [statusMessage, setStatusMessage] = useState('目前運行於 Google Drive 模擬讀取模式');
        const [isSyncing, setIsSyncing] = useState(false);

        // 格式化容量大小
        const formatBytes = (bytes) => {
          if (!bytes || bytes === '0') return '0 Bytes';
          const k = 1024;
          const sizes = ['Bytes', 'KB', 'MB', 'GB'];
          const i = Math.floor(Math.log(Number(bytes)) / Math.log(k));
          return parseFloat((Number(bytes) / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        };

        // 格式化日期為 YYYY-MM-DD
        const formatDate = (isoString) => {
          if (!isoString) return '';
          return isoString.split('T')[0];
        };

        // 自動由 Google Drive 的 modifiedTime 解析年月份樹狀結構
        const yearMonthTree = useMemo(() => {
          const tree = {};
          driveFiles.forEach(file => {
            const dateStr = formatDate(file.modifiedTime);
            const [year, month] = dateStr.split('-');
            const ym = `${year}-${month}`;
            if (!tree[year]) tree[year] = new Set();
            tree[year].add(ym);
          });

          return Object.keys(tree)
            .sort((a, b) => b.localeCompare(a))
            .map(year => ({
              year,
              months: Array.from(tree[year]).sort((a, b) => b.localeCompare(a))
            }));
        }, [driveFiles]);

        // 自動提取 Google Drive 上的資料夾分類 (Projects)
        const folders = useMemo(() => {
          const map = new Map();
          driveFiles.forEach(file => {
            if (file.folderId && !map.has(file.folderId)) {
              map.set(file.folderId, {
                id: file.folderId,
                name: file.folderName || '一般雲端資料夾',
                color: file.folderId.includes('market') ? 'bg-blue-500' :
                       file.folderId.includes('finance') ? 'bg-amber-500' :
                       file.folderId.includes('dev') ? 'bg-emerald-500' : 'bg-purple-500'
              });
            }
          });
          return Array.from(map.values());
        }, [driveFiles]);

        // 切換展開年份
        const toggleYearExpand = (year) => {
          setExpandedYears(prev => prev.includes(year) ? prev.filter(y => y !== year) : [...prev, year]);
        };

        // 依類型產生 Google 圖示
        const renderDriveIcon = (mimeType, size = 20) => {
          if (mimeType.includes('document')) return <IconFileText size={size} className="text-blue-400" />;
          if (mimeType.includes('spreadsheet')) return <IconSpreadsheet size={size} className="text-emerald-400" />;
          if (mimeType.includes('presentation')) return <IconPresentation size={size} className="text-amber-400" />;
          if (mimeType.includes('image')) return <IconImage size={size} className="text-purple-400" />;
          return <IconFileText size={size} className="text-slate-400" />;
        };

        // 真實連接 Google Drive API
        const handleConnectGoogleDrive = () => {
          if (!clientId) {
            setIsConfigModalOpen(true);
            return;
          }

          if (typeof google === 'undefined' || !google.accounts) {
            alert('Google Identity Services 正在加載中，請稍候重試。');
            return;
          }

          try {
            const tokenClient = google.accounts.oauth2.initTokenClient({
              client_id: clientId,
              scope: 'https://www.googleapis.com/auth/drive.readonly',
              callback: async (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                  setIsConnected(true);
                  setAuthMode('live');
                  setStatusMessage('已成功授權連線至您的 Google Drive');
                  setIsConfigModalOpen(false);
                  fetchRealDriveFiles(tokenResponse.access_token);
                }
              },
            });
            tokenClient.requestAccessToken();
          } catch (err) {
            console.error('Google Auth Error:', err);
            alert('連線失敗，請檢查 Client ID 是否正確且授權來源包含此網頁。');
          }
        };

        // 呼叫 Google Drive API v3 獲取真實檔案
        const fetchRealDriveFiles = async (accessToken) => {
          setIsSyncing(true);
          try {
            const res = await fetch(
              'https://www.googleapis.com/drive/v3/files?pageSize=100&fields=files(id,name,mimeType,modifiedTime,size,starred,webViewLink,parents,owners)&q=trashed=false',
              { headers: { Authorization: `Bearer ${accessToken}` } }
            );
            const data = await res.json();
            if (data.files) {
              const mapped = data.files.map(f => ({
                id: f.id,
                name: f.name,
                mimeType: f.mimeType,
                modifiedTime: f.modifiedTime,
                size: f.size || '102400',
                folderName: '我的雲端硬碟',
                folderId: f.parents ? f.parents[0] : 'root',
                starred: f.starred || false,
                webViewLink: f.webViewLink || `https://drive.google.com/file/d/${f.id}/view`,
                author: f.owners?.[0]?.displayName || '我',
                description: `Google Drive 雲端檔案 (格式: ${f.mimeType.split('.').pop()})`
              }));
              setDriveFiles(mapped);
              setStatusMessage(`已從 Google 雲端硬碟同步 ${mapped.length} 個檔案！`);
            }
          } catch (err) {
            console.error('Fetch Drive Files Error:', err);
            setStatusMessage('讀取 Google Drive 檔案失敗，切換回快取資料。');
          } finally {
            setIsSyncing(false);
          }
        };

        // 切換標星
        const toggleStar = (e, id) => {
          e.stopPropagation();
          setDriveFiles(prev => prev.map(f => f.id === id ? { ...f, starred: !f.starred } : f));
        };

        const filteredFiles = useMemo(() => {
          return driveFiles.filter(file => {
            const matchesSearch = searchQuery === '' || 
              file.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
              file.folderName.toLowerCase().includes(searchQuery.toLowerCase());

            if (!matchesSearch) return false;

            if (activeTab === 'starred') return file.starred;
            if (activeTab === 'folder' && selectedFolderId) return file.folderId === selectedFolderId;
            if (activeTab === 'date' && selectedYearMonth) return formatDate(file.modifiedTime).startsWith(selectedYearMonth);

            return true;
          }).sort((a, b) => new Date(b.modifiedTime) - new Date(a.modifiedTime));
        }, [driveFiles, activeTab, selectedFolderId, selectedYearMonth, searchQuery]);

        return (
          <div className="flex h-screen bg-slate-900 text-slate-100 font-sans overflow-hidden">
            
            {/* 側邊導航列 */}
            <aside className="w-72 bg-slate-950 border-r border-slate-800 flex flex-col flex-shrink-0">
              
              {/* Header */}
              <div className="p-5 border-b border-slate-800/80 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="p-2 bg-slate-900 border border-slate-800 rounded-xl shadow-md">
                    <IconGoogleDrive size={24} />
                  </div>
                  <div>
                    <h1 className="font-bold text-sm text-slate-100 flex items-center gap-1.5">
                      <span>雲端硬碟檔案庫</span>
                    </h1>
                    <div className="flex items-center gap-1.5 text-[11px] text-slate-400 mt-0.5">
                      <span className={`w-2 h-2 rounded-full ${isConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`} />
                      <span>{isConnected ? '已連線 Drive' : 'Drive 模擬演示中'}</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Google Drive 授權按鈕列 */}
              <div className="p-4 border-b border-slate-800/50">
                <button
                  onClick={handleConnectGoogleDrive}
                  className="w-full flex items-center justify-center gap-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-2 px-3 rounded-xl transition text-xs shadow-lg shadow-blue-500/20 active:scale-95"
                >
                  <IconGoogleDrive size={16} />
                  <span>{isConnected ? '重新同步 Google 硬碟' : '連接您的 Google 雲端硬碟'}</span>
                </button>
                <div className="flex justify-between items-center mt-2 px-1 text-[11px]">
                  <span className="text-slate-500">{statusMessage}</span>
                  <button onClick={() => setIsConfigModalOpen(true)} className="text-indigo-400 hover:underline">
                    金鑰設定
                  </button>
                </div>
              </div>

              {/* 導覽列表 */}
              <div className="flex-1 overflow-y-auto px-3 py-3 space-y-6 custom-scrollbar text-xs">
                
                {/* 主選單 */}
                <div className="space-y-1">
                  <div className="px-3 font-semibold text-slate-500 uppercase tracking-wider mb-2">檔案視圖</div>
                  
                  <button
                    onClick={() => { setActiveTab('all'); setSelectedFolderId(null); setSelectedYearMonth(null); }}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-lg font-medium transition ${
                      activeTab === 'all' ? 'bg-blue-600/15 text-blue-400 border border-blue-500/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      <IconFolder size={16} className={activeTab === 'all' ? 'text-blue-400' : 'text-slate-400'} />
                      <span>全部雲端檔案</span>
                    </div>
                    <span className="bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">
                      {driveFiles.length}
                    </span>
                  </button>

                  <button
                    onClick={() => { setActiveTab('starred'); setSelectedFolderId(null); setSelectedYearMonth(null); }}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-lg font-medium transition ${
                      activeTab === 'starred' ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      <IconStar size={16} className={activeTab === 'starred' ? 'text-amber-400' : 'text-slate-400'} fill={activeTab === 'starred' ? '#F59E0B' : 'none'} />
                      <span>已加星號文檔</span>
                    </div>
                    <span className="bg-slate-800 px-2 py-0.5 rounded-full text-slate-400">
                      {driveFiles.filter(f => f.starred).length}
                    </span>
                  </button>
                </div>

                {/* 按 Google 雲端硬碟資料夾 (專案) 分類 */}
                <div>
                  <div className="px-3 font-semibold text-slate-500 uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span>Drive 資料夾 (專案分類)</span>
                  </div>
                  <div className="space-y-1">
                    {folders.map(folder => {
                      const count = driveFiles.filter(f => f.folderId === folder.id).length;
                      const isSelected = activeTab === 'folder' && selectedFolderId === folder.id;
                      return (
                        <button
                          key={folder.id}
                          onClick={() => {
                            setActiveTab('folder');
                            setSelectedFolderId(folder.id);
                            setSelectedYearMonth(null);
                          }}
                          className={`w-full flex items-center justify-between px-3 py-2 rounded-lg font-medium transition ${
                            isSelected ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-200'
                          }`}
                        >
                          <div className="flex items-center gap-2 truncate">
                            <span className={`w-2 h-2 rounded-full ${folder.color}`} />
                            <span className="truncate">{folder.name}</span>
                          </div>
                          <span className="text-[10px] text-slate-500">{count}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 按修改時間年月份分類 (Timeline Tree) */}
                <div>
                  <div className="px-3 font-semibold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <IconCalendar size={14} />
                    <span>按修改年月份分類</span>
                  </div>
                  
                  <div className="space-y-1 pl-1">
                    {yearMonthTree.map(({ year, months }) => {
                      const isExpanded = expandedYears.includes(year);
                      return (
                        <div key={year} className="space-y-1">
                          <button
                            onClick={() => toggleYearExpand(year)}
                            className="w-full flex items-center justify-between px-2 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:bg-slate-800/60 transition"
                          >
                            <div className="flex items-center gap-1.5">
                              {isExpanded ? <IconChevronDown size={14} className="text-slate-400" /> : <IconChevronRight size={14} className="text-slate-400" />}
                              <span>{year} 年</span>
                            </div>
                            <span className="text-[10px] text-slate-500 bg-slate-800 px-1.5 py-0.5 rounded">
                              {driveFiles.filter(f => formatDate(f.modifiedTime).startsWith(year)).length}
                            </span>
                          </button>

                          {isExpanded && (
                            <div className="pl-5 space-y-0.5 border-l border-slate-800 ml-3">
                              {months.map(ym => {
                                const [y, m] = ym.split('-');
                                const count = driveFiles.filter(f => formatDate(f.modifiedTime).startsWith(ym)).length;
                                const isSelected = activeTab === 'date' && selectedYearMonth === ym;

                                return (
                                  <button
                                    key={ym}
                                    onClick={() => {
                                      setActiveTab('date');
                                      setSelectedYearMonth(ym);
                                      setSelectedFolderId(null);
                                    }}
                                    className={`w-full flex items-center justify-between px-2 py-1 rounded-md text-xs transition ${
                                      isSelected 
                                        ? 'bg-blue-600/20 text-blue-300 font-semibold border border-blue-500/30' 
                                        : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-200'
                                    }`}
                                  >
                                    <span>{m} 月 ({ym})</span>
                                    <span className="text-[10px] text-slate-500">{count}</span>
                                  </button>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>

            </aside>

            {/* 主內容區塊 */}
            <main className="flex-1 flex flex-col min-w-0 bg-slate-900 overflow-hidden">
              
              {/* 頂部搜尋列 */}
              <header className="h-16 border-b border-slate-800 px-6 flex items-center justify-between gap-4 bg-slate-900/80 backdrop-blur-md flex-shrink-0">
                <div className="relative flex-1 max-w-md">
                  <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                    <IconSearch size={16} />
                  </div>
                  <input 
                    type="text" 
                    placeholder="搜尋 Google Drive 檔案名稱或資料夾..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-800 text-slate-100 placeholder-slate-500 pl-10 pr-4 py-2 rounded-xl text-xs border border-slate-700/60 focus:outline-none focus:border-blue-500"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500">
                      <IconX size={14} />
                    </button>
                  )}
                </div>

                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => {
                      if (isConnected) fetchRealDriveFiles();
                      else {
                        setDriveFiles([...MOCK_DRIVE_FILES]);
                        alert('已重新重設 Google 模擬檔案清單');
                      }
                    }}
                    className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-xl text-xs text-slate-300 transition"
                  >
                    <IconRefresh size={14} className={isSyncing ? 'animate-spin' : ''} />
                    <span>即時重新整理</span>
                  </button>
                </div>
              </header>

              {/* 檔案卡片清單 */}
              <div className="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
                
                {/* 狀態標題 Banner */}
                <div className="bg-slate-800/40 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                  <div>
                    <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                      <IconGoogleDrive size={20} />
                      <span>
                        {activeTab === 'all' && 'Google 雲端硬碟全部檔案'}
                        {activeTab === 'starred' && '已加星號的重要檔案'}
                        {activeTab === 'folder' && `資料夾：${folders.find(f => f.id === selectedFolderId)?.name || '未命名'}`}
                        {activeTab === 'date' && `修改時間：${selectedYearMonth}`}
                      </span>
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">
                      符合條件的雲端檔案：<span className="text-blue-400 font-semibold">{filteredFiles.length}</span> 件
                    </p>
                  </div>

                  <a 
                    href="https://drive.google.com" 
                    target="_blank" 
                    rel="noreferrer"
                    className="flex items-center gap-1.5 text-xs text-blue-400 hover:text-blue-300 bg-blue-500/10 border border-blue-500/20 px-3 py-1.5 rounded-xl transition"
                  >
                    <span>開啟官方 Google 雲端硬碟</span>
                    <IconExternalLink size={14} />
                  </a>
                </div>

                {/* 檔案卡片 Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                  {filteredFiles.map(file => (
                    <div 
                      key={file.id}
                      className="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/60 hover:border-blue-500/50 rounded-2xl p-4 transition flex flex-col justify-between group shadow-lg"
                    >
                      <div>
                        {/* 頂部圖示與星號 */}
                        <div className="flex items-start justify-between mb-3">
                          <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-700/50">
                            {renderDriveIcon(file.mimeType, 22)}
                          </div>
                          <div className="flex items-center gap-1">
                            <button 
                              onClick={(e) => toggleStar(e, file.id)}
                              className={`p-1 transition ${file.starred ? 'text-amber-400' : 'text-slate-500 hover:text-slate-300'}`}
                            >
                              <IconStar size={16} fill={file.starred ? '#F59E0B' : 'none'} />
                            </button>
                            <a
                              href={file.webViewLink}
                              target="_blank"
                              rel="noreferrer"
                              title="在 Google 雲端硬碟中檢視或編輯"
                              className="p-1 text-slate-400 hover:text-blue-400 transition"
                            >
                              <IconExternalLink size={16} />
                            </a>
                          </div>
                        </div>

                        {/* 檔名與說明 */}
                        <h3 className="font-semibold text-slate-100 text-xs line-clamp-1 mb-1 group-hover:text-blue-400 transition" title={file.name}>
                          {file.name}
                        </h3>
                        <p className="text-[11px] text-slate-400 line-clamp-2 h-7 mb-2">
                          {file.description}
                        </p>
                      </div>

                      {/* 底部元數據 */}
                      <div className="pt-3 border-t border-slate-700/50 space-y-1.5 text-[10px]">
                        <div className="flex justify-between items-center text-slate-400">
                          <span className="flex items-center gap-1"><IconCalendar size={12} /> {formatDate(file.modifiedTime)}</span>
                          <span>{formatBytes(file.size)}</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span className="px-2 py-0.5 rounded bg-blue-600/20 text-blue-300 border border-blue-500/30 truncate max-w-[120px]">
                            {file.folderName}
                          </span>
                          <span className="text-slate-500">作者: {file.author}</span>
                        </div>
                      </div>

                    </div>
                  ))}
                </div>

              </div>

            </main>

            {/* Modal: Google Cloud API Client ID 設定 */}
            {isConfigModalOpen && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg p-6 space-y-4 text-xs">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 className="font-bold text-sm text-slate-100 flex items-center gap-2">
                      <IconGoogleDrive size={18} />
                      <span>設定 Google Drive API 憑證</span>
                    </h3>
                    <button onClick={() => setIsConfigModalOpen(false)}><IconX size={16} /></button>
                  </div>

                  <div className="space-y-3 text-slate-300 leading-relaxed">
                    <p className="text-slate-400">
                      若要將此網頁直接讀取您的真實 Google 雲端硬碟，需至 Google Cloud Console 建立免費的 OAuth 2.0 Client ID：
                    </p>
                    <ol className="list-decimal pl-4 space-y-1 text-slate-400">
                      <li>前往 Google Cloud Console 啟用 <b>Google Drive API</b>。</li>
                      <li>在「憑證」中建立 <b>OAuth 2.0 用戶端 ID</b>（應用程式類型選擇「網頁應用程式」）。</li>
                      <li>將此網頁的網址加入「已獲授權的 JavaScript 來源」。</li>
                      <li>將產生的用戶端 ID 貼至下方即可。</li>
                    </ol>

                    <div>
                      <label className="block text-slate-400 mb-1 font-semibold">Google OAuth Client ID</label>
                      <input 
                        type="text" 
                        placeholder="例如: 123456789-xxxxxx.apps.googleusercontent.com"
                        value={clientId}
                        onChange={(e) => setClientId(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>

                  <div className="flex justify-between items-center pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => {
                        setIsConfigModalOpen(false);
                        setStatusMessage('維持展示演示模式');
                      }}
                      className="text-slate-400 hover:text-slate-200"
                    >
                      使用展示模式
                    </button>
                    <button
                      type="button"
                      onClick={handleConnectGoogleDrive}
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium"
                    >
                      確認並發起 Google 授權
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
